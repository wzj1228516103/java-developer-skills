id: controller-validation
title: Controller 参数校验与响应边界
description: 验证 Skill 是否要求请求 DTO、参数校验以及避免直接暴露持久化实体。
input:
  prompt: |
    请为 Spring Boot 项目设计一个创建订单接口。要求校验商品编号和数量，说明 Controller、请求 DTO、Service 和响应对象如何分层。请明确指出为什么不能直接把 Entity 返回给前端，并给出关键 Java 代码骨架。
constraints:
  timeout_seconds: 420
  max_turns: 8
expect:
  must_contain:
    - "DTO"
    - "校验"
    - "Service"
    - "Entity"
  must_not_contain:
    - "忽略参数校验"
