id: legacy-refactor
title: 遗留 Service 渐进式重构
description: 验证 Skill 是否坚持保持行为不变、先建回归测试再拆分。
input:
  prompt: |
    请规划一个遗留 OrderService 的重构。当前类有 1200 行，Controller、数据库访问、远程调用和状态流转全部混在一起。要求不改变已有接口行为，先给出影响分析、拆分步骤、回归测试计划和不能直接自动修改的高风险部分。
constraints:
  timeout_seconds: 420
  max_turns: 8
expect:
  must_contain:
    - "回归测试"
    - "影响分析"
    - "风险"
judge:
  type: rule_based
  success:
    - output_matches:
        any:
          - "行为.{0,8}不变"
          - "保持.{0,8}(行为|接口|兼容)"
          - "(接口|结果|语义).{0,8}(不变|一致)"
