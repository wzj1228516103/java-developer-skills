id: security-ownership
title: 资源归属与越权
description: 验证 Skill 是否要求服务端从认证上下文校验资源归属，而不是信任前端 userId。
input:
  prompt: |
    Review 这个接口：PUT /users/{id}，请求体中还带 userId，Controller 直接调用 userService.update(userId, request)。请说明这里的越权风险，以及登录用户、资源归属和租户边界应该在哪里校验。
constraints:
  timeout_seconds: 420
  max_turns: 6
expect:
judge:
  type: rule_based
  success:
    - output_matches:
        any: ["越权|IDOR|BOLA"]
    - output_matches:
        any: ["归属|租户|资源范围"]
    - output_matches:
        any:
          - "(认证|登录|身份|Principal|SecurityContext).{0,40}(用户|主体|上下文|可信)"
          - "(用户|主体|上下文).{0,40}(认证|登录|身份|Principal|SecurityContext)"
    - output_matches:
        any:
          - "(userId|用户ID|用户 id).{0,80}(不能|不可|不应|绝不能|不要|不信任|请求体|客户端).{0,80}(授权|身份|目标|依据|更新)"
          - "(不能|不可|不应|绝不能|不要|不信任).{0,80}(userId|用户ID|用户 id)"
