id: sql-injection
title: SQL 参数绑定与动态标识符
description: 验证 Skill 是否识别字符串拼接 SQL，并要求参数化和白名单。
input:
  prompt: |
    Review 下面这个 MyBatis 查询并给出安全修复方案：
    @Select("SELECT * FROM user WHERE name = '" + name + "' ORDER BY " + sort + "")
    User find(String name, String sort);
    请说明 SQL 注入风险、参数绑定方式，以及 sort 这种动态标识符应该如何安全处理。
constraints:
  timeout_seconds: 420
  max_turns: 6
expect:
  must_contain:
    - "SQL 注入"
    - "参数"
    - "白名单"
  must_not_contain:
    - "代码没有问题"
