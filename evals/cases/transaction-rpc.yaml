id: transaction-rpc
title: 事务边界与远程调用
description: 验证 Skill 是否识别事务内远程调用和重试幂等风险。
input:
  prompt: |
    评审一个 @Transactional 的订单支付方法：方法先更新订单状态，然后调用支付 HTTP 接口，失败时自动重试三次。请指出事务边界、超时、重试和幂等方面的问题，并给出更可靠的设计。
constraints:
  timeout_seconds: 420
  max_turns: 8
expect:
  must_contain:
    - "事务"
    - "幂等"
    - "超时"
    - "重试"
