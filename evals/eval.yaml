schema_version: v1alpha1

environment:
  type: none
  workspace_mount: /workspace

skills:
  - source: local_path
    path: .
    # 评测只安装 Skill 运行所需文件，避免把 README、评测样例和报告带入上下文。
    include:
      - SKILL.md
      - skills/**/SKILL.md
      - references/**
      - templates/**
      - memory.md
      - project/**
      - agents/**
      - .codex-plugin/plugin.json
      - skills.registry.json
    exclude:
      - README.md
      - project/README.md
      - evals/**
      - .git/**

engine:
  name: codex
  model: {}

cases:
  files:
    - evals/cases/controller-validation.yaml
    - evals/cases/sql-injection.yaml
    - evals/cases/transaction-rpc.yaml
    - evals/cases/security-ownership.yaml
    - evals/cases/cache-mq.yaml
    - evals/cases/legacy-refactor.yaml
  defaults:
    timeout_seconds: 420
    max_turns: 8
  parallelism: 1

benchmark:
  enabled: true

judge:
  type: rule_based
  success:
    - exit_code: 0

report:
  formats: [json, junit, html]
  artifacts:
    - transcript
